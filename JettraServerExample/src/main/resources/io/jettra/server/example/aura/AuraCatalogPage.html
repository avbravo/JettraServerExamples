<aura:extend>
    <div aura:id="feedbackMessages"></div>

    <!-- FORMULARIO DE ALTA CON COMPOUND PROPERTY MODEL -->
    <div class="ui-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.75rem;">
            <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin: 0;">Registrar Nuevo Producto (JPA)</h3>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Persistencia Transaccional</span>
        </div>
        <form aura:id="productForm">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; align-items: end;">
                <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                    <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Código ID:</label>
                    <input type="text" aura:id="id" placeholder="PRD-XX" required style="background: var(--bg-body); border: 1px solid var(--border-subtle); border-radius: 6px; color: var(--text-main); padding: 0.65rem; outline: none;" />
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                    <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Nombre:</label>
                    <input type="text" aura:id="name" placeholder="Ej. Switch Óptico" required style="background: var(--bg-body); border: 1px solid var(--border-subtle); border-radius: 6px; color: var(--text-main); padding: 0.65rem; outline: none;" />
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                    <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Categoría:</label>
                    <select aura:id="category" style="background: var(--bg-body); border: 1px solid var(--border-subtle); border-radius: 6px; color: var(--text-main); padding: 0.65rem; outline: none;">
                        <option value="Hardware">Hardware</option>
                        <option value="Software">Software</option>
                        <option value="Redes">Redes</option>
                        <option value="Almacenamiento">Almacenamiento</option>
                    </select>
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                    <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Precio ($):</label>
                    <input type="number" step="0.01" aura:id="price" placeholder="0.00" required style="background: var(--bg-body); border: 1px solid var(--border-subtle); border-radius: 6px; color: var(--text-main); padding: 0.65rem; outline: none;" />
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                    <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Stock:</label>
                    <input type="number" aura:id="stock" placeholder="0" required style="background: var(--bg-body); border: 1px solid var(--border-subtle); border-radius: 6px; color: var(--text-main); padding: 0.65rem; outline: none;" />
                </div>
                <div>
                    <button type="submit" aura:id="btnSaveProduct" class="btn-action" style="width: 100%;">Guardar Producto</button>
                </div>
            </div>
        </form>
    </div>

    <!-- TABLA ITERATIVA REPETIDORA CON AURALISTVIEW -->
    <div class="ui-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.75rem;">
            <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin: 0;">Catálogo JettraAura (AuraListView)</h3>
            <span aura:id="catalogCountBadge" class="badge" style="background: #1e3a8a; color: #93c5fd;">0 Productos</span>
        </div>
        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; margin-top: 0.5rem;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--border-subtle); text-align: left;">
                        <th style="padding: 0.75rem 1rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Código ID</th>
                        <th style="padding: 0.75rem 1rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Nombre</th>
                        <th style="padding: 0.75rem 1rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Categoría</th>
                        <th style="padding: 0.75rem 1rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Precio</th>
                        <th style="padding: 0.75rem 1rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Stock</th>
                        <th style="padding: 0.75rem 1rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr aura:id="productList" style="border-bottom: 1px solid var(--border-subtle);">
                        <td aura:id="prodId" style="padding: 0.85rem 1rem; font-weight: 600;">PRD-00</td>
                        <td aura:id="prodName" style="padding: 0.85rem 1rem;">Nombre de muestra</td>
                        <td style="padding: 0.85rem 1rem;"><span aura:id="prodCategory" class="badge" style="background: #064e3b; color: #6ee7b7;">General</span></td>
                        <td aura:id="prodPrice" style="padding: 0.85rem 1rem; font-weight: 700; color: #38bdf8;">$0.00</td>
                        <td aura:id="prodStock" style="padding: 0.85rem 1rem;">0</td>
                        <td style="padding: 0.85rem 1rem;">
                            <a href="#" aura:id="btnDeleteProduct" style="color: #f87171; text-decoration: none; font-weight: 600;">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</aura:extend>
