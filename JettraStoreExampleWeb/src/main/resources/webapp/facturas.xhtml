<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

<ui:composition template="template.xhtml">
    <ui:define name="title">Facturación (example_factura_db) - Jakarta Faces + RestClient + JWT</ui:define>

    <ui:define name="center">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;">
            <div>
                <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.25rem;">
                    <span style="background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 800;">JAKARTA FACES + REST CLIENT</span>
                    <span style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.35); color: #10b981; padding: 0.2rem 0.55rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700;">🔒 JETTRA JWT BEARER</span>
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin: 0;">🧾 Gestión de Facturas (example_factura_db)</h1>
                <p style="color: var(--text-muted); margin: 0.25rem 0 0; font-size: 0.85rem;">Consumiendo <code>#{facturaBean.backendUrl}/api/v1/facturas</code> con MicroProfile RestClient y JWT.</p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <p:commandButton value="➕ Nueva Factura" icon="pi pi-plus" styleClass="ui-button-success"
                                 actionListener="#{facturaBean.openNew}" update=":dialogFacturaForm:facturaDialogPanel"
                                 onclick="PF('dlgFactura').show();" type="button"/>
            </div>
        </div>

        <p:messages id="messages" showDetail="true" closable="true"/>

        <h:form id="formFiltroFactura" style="margin-bottom: 1rem;">
            <div style="display: flex; gap: 0.75rem; align-items: center; background: var(--bg-card); padding: 0.85rem 1rem; border-radius: 8px; border: 1px solid var(--border-subtle);">
                <p:inputText value="#{facturaBean.filterTerm}" placeholder="Filtrar por folio, cliente o estado..." style="flex: 1;">
                    <p:ajax event="keyup" update=":formFacturas:dtFacturas"/>
                </p:inputText>
                <p:commandButton value="Refrescar" icon="pi pi-refresh" actionListener="#{facturaBean.refreshList}"
                                 update=":formFacturas:dtFacturas :messages" styleClass="ui-button-secondary"/>
            </div>
        </h:form>

        <h:form id="formFacturas">
            <p:dataTable id="dtFacturas" var="fac" value="#{facturaBean.filteredFacturas}"
                         styleClass="ui-datatable-striped ui-datatable-hover" paginator="true" rows="10"
                         emptyMessage="No se encontraron facturas en example_factura_db.">
                <p:column headerText="Folio">
                    <h:outputText value="#{fac.folio()}" style="font-weight: 700; color: var(--primary);"/>
                </p:column>
                <p:column headerText="Cliente">
                    <h:outputText value="#{fac.clienteNombre()}"/>
                </p:column>
                <p:column headerText="Fecha">
                    <h:outputText value="#{fac.fechaEmision()}"/>
                </p:column>
                <p:column headerText="Estado">
                    <h:outputText value="#{fac.estado()}" style="font-weight: 700;"/>
                </p:column>
                <p:column headerText="Total ($)">
                    <h:outputText value="#{fac.total()}"/>
                </p:column>
                <p:column headerText="Acciones" style="width: 190px; text-align: center;">
                    <p:commandButton icon="pi pi-pencil" title="Editar" styleClass="ui-button-sm ui-button-info"
                                     actionListener="#{facturaBean.edit(fac)}" update=":dialogFacturaForm:facturaDialogPanel"
                                     onclick="PF('dlgFactura').show();" style="margin-right: 0.25rem;"/>
                    <p:commandButton icon="pi pi-ban" title="Anular" styleClass="ui-button-sm ui-button-warning"
                                     actionListener="#{facturaBean.anular(fac)}" update=":formFacturas:dtFacturas :messages"
                                     style="margin-right: 0.25rem;"/>
                    <p:commandButton icon="pi pi-trash" title="Eliminar" styleClass="ui-button-sm ui-button-danger"
                                     actionListener="#{facturaBean.delete(fac)}" update=":formFacturas:dtFacturas :messages"/>
                </p:column>
            </p:dataTable>
        </h:form>

        <p:dialog header="Emitir / Editar Factura (RestClient + JWT)" widgetVar="dlgFactura" modal="true" responsive="true" width="520">
            <h:form id="dialogFacturaForm">
                <p:outputPanel id="facturaDialogPanel" styleClass="ui-fluid">
                    <div style="margin-bottom: 0.85rem;">
                        <p:outputLabel for="folio" value="Folio:"/>
                        <p:inputText id="folio" value="#{facturaBean.folio}" placeholder="FAC-2026-0002 (opcional)"/>
                    </div>
                    <div style="margin-bottom: 0.85rem;">
                        <p:outputLabel for="clienteId" value="ID Cliente:"/>
                        <p:inputText id="clienteId" value="#{facturaBean.clienteId}" required="true"/>
                    </div>
                    <div style="margin-bottom: 0.85rem;">
                        <p:outputLabel for="clienteNombre" value="Nombre del Cliente:"/>
                        <p:inputText id="clienteNombre" value="#{facturaBean.clienteNombre}" required="true"/>
                    </div>
                    <div style="margin-bottom: 0.85rem;">
                        <p:outputLabel for="itemDescripcion" value="Descripción del Ítem:"/>
                        <p:inputText id="itemDescripcion" value="#{facturaBean.itemDescripcion}" required="true"/>
                    </div>
                    <div style="display: flex; gap: 0.75rem; margin-bottom: 1rem;">
                        <div style="flex: 1;">
                            <p:outputLabel for="itemCantidad" value="Cantidad:"/>
                            <p:inputText id="itemCantidad" value="#{facturaBean.itemCantidad}" required="true"/>
                        </div>
                        <div style="flex: 1;">
                            <p:outputLabel for="itemPrecio" value="Precio Unitario:"/>
                            <p:inputText id="itemPrecio" value="#{facturaBean.itemPrecio}" required="true"/>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                        <p:commandButton value="Cancelar" type="button" onclick="PF('dlgFactura').hide();" styleClass="ui-button-secondary"/>
                        <p:commandButton value="Guardar Factura" actionListener="#{facturaBean.save}"
                                         update=":formFacturas:dtFacturas :messages" oncomplete="PF('dlgFactura').hide();" styleClass="ui-button-primary"/>
                    </div>
                </p:outputPanel>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
</html>
