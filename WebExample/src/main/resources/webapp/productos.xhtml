<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

<f:loadBundle basename="messages" var="msg"/>

<ui:composition template="template.xhtml">
    <ui:define name="title">#{msg['catalog.title']} - JettraServer</ui:define>

    <ui:define name="center">
        <h2>#{msg['catalog.title']} (Jakarta JPA 3.2)</h2>

        <h:form id="formProductos">
            <p:dataTable var="prod" value="#{productBean.products}" styleClass="ui-datatable-striped">
                <p:column headerText="#{msg['catalog.id']}">
                    <h:outputText value="#{prod.id}"/>
                </p:column>
                <p:column headerText="#{msg['catalog.name']}">
                    <h:outputText value="#{prod.name}"/>
                </p:column>
                <p:column headerText="#{msg['catalog.category']}">
                    <p:tag value="#{prod.category}"/>
                </p:column>
                <p:column headerText="#{msg['catalog.price']} ($)">
                    <h:outputText value="#{prod.price}">
                        <f:convertNumber type="currency" currencySymbol="$"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg['catalog.stock']}">
                    <h:outputText value="#{prod.stock}"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
</html>
