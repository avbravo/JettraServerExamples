# ==============================================================================
# ECLIPSE MICROPROFILE CONFIGURATION (MicroProfile Config 3.1)
# WebExample - Jakarta EE 11, PrimeFaces 16 & JettraFlux
# ==============================================================================

# Perfil de aplicación
mp.config.profile=dev

# Configuración del Servidor y Red
server.host=0.0.0.0
server.port=8080
server.contextpath=/
server.virtual-threads=true

# Almacenamiento Tri-Modal
# Modo de Almacenamiento (OFF_HEAP, DISK_MEMORY, JVM_RAM)
#storage.mode=JVM_RAM
storage.mode=OFF_HEAP
data.dir=./data/jettra-server-example

# Seguridad y JWT
server.jwt.secret=jettra_server_example_jwt_key_2026
server.jwt.expiration=86400000

# MicroProfile Telemetry & Metrics
mp.metrics.appName=WebExample
mp.metrics.tags=app=WebExample,env=dev,ui=PrimeFaces+JettraFlux

# ==============================================================================
# Eclipse MicroProfile Rest Client 3.0 Configuration
# ==============================================================================
customer-client/mp-rest/url=http://localhost:8081
customer-client/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
customer-client/mp-rest/connectTimeout=5000
customer-client/mp-rest/readTimeout=5000

# Backend Example Integration
backend.api.url=http://localhost:8081
backend.api.auth.user=admin
backend.api.auth.password=admin
backend.jwt.secret=jettra_backend_super_secret_jwt_key_2026


