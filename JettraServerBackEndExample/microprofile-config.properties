# ==============================================================================
# ECLIPSE MICROPROFILE CONFIGURATION (MicroProfile Config 3.1)
# JettraServerBackEndExample - Microservicios Backend con Java 25 & Project Loom
# ==============================================================================

# Perfil de microservicios
mp.config.profile=microservices

# Configuración de Servidor y Red
server.host=0.0.0.0
server.port=8083
server.contextpath=/
server.virtual-threads=true

# Persistencia y Datos
storage.mode=JVM_RAM
data.dir=./data/jettra-backend
security.db.path=./data/jettra-backend/securitydb

# Seguridad de Tokens JWT
server.jwt.secret=jettra_backend_super_secret_jwt_key_2026
server.jwt.expiration=86400000

# MicroProfile Config & Metrics
mp.health.default.readiness.empty.response=UP
mp.metrics.appName=JettraServerBackEndExample
mp.metrics.tags=service=backend-microservices,env=production

