# ==============================================================================
# ECLIPSE MICROPROFILE CONFIGURATION (MicroProfile Config 3.1)
# JettraStoreExampleMicroservices - Microservicios de Facturación (example_factura_db)
# ==============================================================================

mp.config.profile=microservices

# Configuración de Servidor y Red
server.host=0.0.0.0
server.port=8083
server.contextpath=/
server.virtual-threads=true

# Persistencia y Datos
storage.mode=JVM_RAM
data.dir=./data/jettra-microservices
security.db.path=./data/jettra-microservices/securitydb
jettra.database=example_factura_db

# Seguridad de Tokens JWT
server.jwt.secret=jettra_microservices_super_secret_jwt_key_2026
server.jwt.expiration=86400000

# MicroProfile Config & Metrics
mp.health.default.readiness.empty.response=UP
mp.metrics.appName=JettraStoreExampleMicroservices
mp.metrics.tags=service=facturacion-microservices,database=example_factura_db
